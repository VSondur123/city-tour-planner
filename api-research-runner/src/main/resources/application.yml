
spring:
  application:
    name: api-research-runner

  main:
    web-application-type: none
    banner-mode: off

research:
  http:
    connect-timeout-seconds: 10
    request-timeout-seconds: 20

  report:
    output-directory: reports
    response-preview-max-length: 500

  sources:
    fmi:
      enabled: true
      base-url: https://opendata.fmi.fi
      endpoints:
        helsinki-forecast:
          path: /wfs
          method: GET
          parameters:
            service: WFS
            version: "2.0.0"
            request: getFeature
            storedquery_id: "fmi::forecast::harmonie::surface::point::multipointcoverage"
            place: tampere

    digitraffic:
      enabled: true
      base-url: https://tie.digitraffic.fi
      endpoints:
        traffic-announcements:
          path: /api/traffic-message/v2/traffic-announcements
          method: GET
          parameters: {}


    places:
      enabled: true
      base-url: https://www.hel.fi/palvelukarttaws/rest/v4
      endpoints:
        service-locations:
          path: /unit/
          method: GET
          parameters: { }

    # Helsinki Service Map filtered by ontology tree (749 sights, 362 museums,
    # 491 parks and green areas, 344 botanic gardens)
    places-helsinki-sights:
      enabled: true
      base-url: https://www.hel.fi/palvelukarttaws/rest/v4
      endpoints:
        units:
          path: /unit/
          method: GET
          parameters:
            ontologytree: "749"

    places-helsinki-museums:
      enabled: true
      base-url: https://www.hel.fi/palvelukarttaws/rest/v4
      endpoints:
        units:
          path: /unit/
          method: GET
          parameters:
            ontologytree: "362"

    places-helsinki-parks:
      enabled: true
      base-url: https://www.hel.fi/palvelukarttaws/rest/v4
      endpoints:
        units:
          path: /unit/
          method: GET
          parameters:
            ontologytree: "491"

    places-helsinki-gardens:
      enabled: true
      base-url: https://www.hel.fi/palvelukarttaws/rest/v4
      endpoints:
        units:
          path: /unit/
          method: GET
          parameters:
            ontologytree: "344"

    # VisitTampere website map backend (undocumented; the documented
    # /api/v1/* endpoints return a 404 page). Returns all categories at once.
    places-tampere-visittampere:
      enabled: true
      base-url: https://visittampere.fi
      endpoints:
        destination-markers:
          path: /wp-json/v1/destination-markers
          method: GET
          parameters: { }

